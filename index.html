<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страховий калькулятор тарифів</title>
    <link rel="stylesheet" href="style.css">
    <!-- Бібліотека для зчитування Excel файлів -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Калькулятор страхових тарифів</h1>
            <div id="dataStatus" class="status-badge">Завантаження тарифів...</div>
        </header>

        <main class="calculator-grid">
            <!-- Секція 1: Параметри -->
            <section class="card form-section">
                <h2>Параметри розрахунку</h2>

                <div class="form-group">
                    <label for="gridSelect">Тарифна сітка / Умова:</label>
                    <select id="gridSelect">
                        <option value="">-- Оберіть тарифну сітку --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="vehicleSelect">Тип транспортного засобу (ТЗ):</label>
                    <select id="vehicleSelect" disabled>
                        <option value="">-- Спочатку оберіть сітку --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Зона страхування:</label>
                    <div class="zones-grid" id="zonesContainer">
                        <!-- Зони 1, 2, 2.1, 3, 4, 4.1, 5, 5.1, 5.2, 6 -->
                    </div>
                </div>
            </section>

            <!-- Секція 2: Результат -->
            <section class="card result-section">
                <h2>Підсумковий тариф</h2>
                <div class="result-box">
                    <div class="price-label">Страхова премія:</div>
                    <div class="price-value" id="totalPrice">0.00 <span class="currency">грн</span></div>
                </div>
                <div class="details-summary" id="calcDetails">
                    Оберіть тарифну сітку, тип ТЗ та зону для отримання розрахунку.
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
